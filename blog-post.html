<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampTrade - Blog</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/shared.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600&family=Georgia&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #FAF8F5; /* Warm, soft off-white background */
            color: #2b2b2b;
            margin: 0;
            padding: 0;
        }

        /* HERO SECTION */
        .post-hero-section {
            position: relative;
            height: 65vh;
            min-height: 400px;
            max-height: 550px;
            overflow: hidden;
        }

        .post-hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            display: block;
        }

        .post-hero-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2d5a1b, #1a3a0a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .post-hero-overlay {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 80%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
        }

        .post-hero-content {
            position: absolute;
            bottom: 35px;
            left: 0; right: 0;
            padding: 0 40px;
            max-width: 850px;
            margin: 0 auto;
        }

        .post-tag {
            display: inline-block;
            background: #f5a623;
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .post-hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            color: white;
            line-height: 1.3;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom: 14px;
        }

        .post-hero-meta {
            display: flex;
            gap: 18px;
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            align-items: center;
        }

        .admin-edit-btn {
            background: #2d5a1b;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            transition: background 0.2s;
        }
        .admin-edit-btn:hover { background: #3d7a25; }

        /* BACK BUTTON */
        .back-btn {
            position: absolute;
            top: 25px;
            left: 30px;
            z-index: 10;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.3s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .back-btn:hover { background: rgba(255,255,255,0.35); }

        /* ARTICLE BODY STYLES */
        .article-wrapper {
            max-width: 820px;
            margin: 0 auto;
            padding: 50px 25px 70px;
        }

        .article-body {
            font-family: 'Georgia', serif; /* Better editorial reading style */
            font-size: 16.5px;
            color: #333;
            line-height: 1.8;
            overflow: hidden; /* Clearfix for floating images */
        }

        .article-body h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #1c3811;
            margin: 35px 0 15px;
            font-weight: 700;
            clear: both;
        }

        .article-body p { margin-bottom: 22px; }

        /* SIDE-BY-SIDE IMAGE LAYOUTS (Side-by-text effect like target image) */
        .article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin: 15px 0;
            display: block;
        }

        .article-body img.img-right {
            float: right;
            width: 42%;
            margin: 0 0 20px 25px;
        }

        .article-body img.img-left {
            float: left;
            width: 42%;
            margin: 0 25px 20px 0;
        }

        .article-body img.img-full {
            width: 100%;
            margin: 25px 0;
        }

        /* DIVIDER & SHARE */
        .article-divider {
            width: 50px;
            height: 3px;
            background: #f5a623;
            border-radius: 2px;
            margin: 40px 0;
            clear: both;
        }

        .share-section {
            background: #f2efe9;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-top: 40px;
            clear: both;
        }

        .share-section p {
            font-size: 12px;
            color: #777;
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Inter', sans-serif;
        }

        .share-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .share-btn {
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s;
        }

        .share-btn:hover { opacity: 0.85; }
        .share-btn.wa { background: #25D366; color: white; }
        .share-btn.copy { background: #2d5a1b; color: white; }

        /* RELATED POSTS */
        .related-section {
            background: #EFECE6;
            padding: 50px 25px;
            border-top: 1px solid #E2DFD7;
        }

        .related-inner { max-width: 820px; margin: 0 auto; }

        .related-inner h3 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 25px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .related-card {
            background: #FAF8F5;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .related-card:hover { transform: translateY(-4px); }

        .related-card-img { width: 100%; height: 140px; object-fit: cover; }
        .related-card-placeholder {
            width: 100%; height: 140px;
            background: #2d5a1b;
            display: flex; align-items: center; justify-content: center; font-size: 35px;
        }

        .related-card-info { padding: 15px; font-family: 'Inter', sans-serif; }
        .related-card-tag { font-size: 10px; font-weight: 700; color: #f5a623; text-transform: uppercase; margin-bottom: 5px; }
        .related-card-info h4 { font-size: 14px; color: #1a1a1a; line-height: 1.4; margin-bottom: 6px; font-weight: 600; }
        .related-card-info p { font-size: 11px; color: #888; }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .post-hero-section { height: 50vh; min-height: 320px; }
            .post-hero-title { font-size: 24px; }
            .article-body { font-size: 15.5px; }
            .article-body img.img-right, 
            .article-body img.img-left {
                float: none;
                width: 100%;
                margin: 15px 0;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">
        <img src="images/logo.jpeg" alt="CampTrade Logo">
    </a>
    <nav>
        <a href="index.html">Ana Səhifə</a>
        <a href="satis.html">Satılıq</a>
        <a href="kiraye.html">Kirayə</a>
        <a href="sat.html">Məhsul Sat</a>
        <a href="blog.html">Blog</a>
        <a href="elaqe.html">Əlaqə</a>
    </nav>
    <div class="lang-switcher">
        <button class="lang-btn active">🇦🇿</button>
        <button class="lang-btn">🇬🇧</button>
        <button class="lang-btn">🇷🇺</button>
    </div>
</header>

<div id="postContent">
    <div style="text-align:center; padding: 100px 20px;">
        <p style="color:#888;">Yazı yüklənir...</p>
    </div>
</div>

<div class="related-section" id="relatedSection" style="display:none">
    <div class="related-inner">
        <h3>Digər Yazılar</h3>
        <div class="related-grid" id="relatedGrid"></div>
    </div>
</div>

<footer>
    <div class="footer-logo">
        <img src="images/logo.jpeg" alt="CampTrade">
    </div>
    <div class="social-links">
        <a href="https://facebook.com/LINKINI_YAZ" target="_blank">📘 Facebook</a>
        <a href="https://instagram.com/LINKINI_YAZ" target="_blank">📸 Instagram</a>
        <a href="https://wa.me/994NOMERINIYAZ" target="_blank">💬 WhatsApp</a>
        <a href="https://tiktok.com/@LINKINI_YAZ" target="_blank">📱 TikTok</a>
    </div>
    <p>© 2026 CampTrade. All rights reserved.</p>
</footer>

<script>
var SUPABASE_URL = "https://iupwahtmnybxrowbkcfs.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cHdhaHRtbnlieHJvd2JrY2ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMTU3MDksImV4cCI6MjA5NTg5MTcwOX0.QG1fL54mB8-mMKhb3Amc7W7yhTAfo3mCP5UubdVqw4E";

function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

function copyLink() {
    navigator.clipboard.writeText(window.location.href);
    alert('✅ Link kopyalandı!');
}

async function loadPost() {
    var id = getParam('id');
    var container = document.getElementById('postContent');

    if (!id) {
        container.innerHTML = '<div style="text-align:center;padding:100px 20px;"><h2 style="color:#e53e3e;">❌ Yazı tapılmadı</h2><a href="blog.html" style="color:#2d5a1b;font-weight:700;">← Bloga qayıt</a></div>';
        return;
    }

    try {
        var res = await fetch(SUPABASE_URL + '/rest/v1/blogs?id=eq.' + id, {
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY
            }
        });

        var data = await res.json();

        if (!data || data.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:100px 20px;"><h2 style="color:#e53e3e;">❌ Yazı tapılmadı</h2><a href="blog.html" style="color:#2d5a1b;font-weight:700;">← Bloga qayıt</a></div>';
            return;
        }

        var b = data[0];
        var date = new Date(b.created_at).toLocaleDateString('az-AZ', {day:'numeric', month:'long', year:'numeric'});

        document.title = b.baslig + ' — CampTrade Blog';

        var waLink = 'https://wa.me/?text=' + encodeURIComponent(b.baslig + ' ' + window.location.href);

        var heroHtml = b.sekil
            ? '<img class="post-hero-img" src="' + b.sekil + '" alt="' + b.baslig + '">'
            : '<div class="post-hero-placeholder">📰</div>';

        container.innerHTML =
            '<div class="post-hero-section">' +
                '<a href="blog.html" class="back-btn">← Bloga Qayıt</a>' +
                heroHtml +
                '<div class="post-hero-overlay"></div>' +
                '<div class="post-hero-content">' +
                    '<span class="post-tag">' + (b.kateqoriya || 'Ümumi') + '</span>' +
                    '<h1 class="post-hero-title">' + b.baslig + '</h1>' +
                    '<div class="post-hero-meta">' +
                        '<span>📅 ' + date + '</span>' +
                        '<span>⏱️ ' + (b.oxuma_muddeti || '3 dəq') + '</span>' +
                        '<a href="admin.html?edit_blog=' + b.id + '" class="admin-edit-btn">✏️ Redaktə Et</a>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="article-wrapper">' +
                '<div class="article-body">' + b.metn + '</div>' +
                '<div class="article-divider"></div>' +
                '<div class="share-section">' +
                    '<p>Bu yazını paylaş</p>' +
                    '<div class="share-btns">' +
                        '<a href="' + waLink + '" class="share-btn wa" target="_blank">💬 WhatsApp</a>' +
                        '<button onclick="copyLink()" class="share-btn copy" style="border:none;cursor:pointer;">🔗 Linki Kopyala</button>' +
                    '</div>' +
                '</div>' +
            '</div>';

        loadRelated(b.id, b.kateqoriya);

    } catch(e) {
        container.innerHTML = '<div style="text-align:center;padding:100px 20px;"><h2>❌ Xəta baş verdi</h2><a href="blog.html" style="color:#2d5a1b;">← Bloga qayıt</a></div>';
    }
}

async function loadRelated(currentId, category) {
    try {
        var res = await fetch(SUPABASE_URL + '/rest/v1/blogs?order=created_at.desc', {
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY
            }
        });

        var blogs = await res.json();
        var filtered = blogs.filter(function(b) { return b.id !== currentId; }).slice(0, 3);

        if (filtered.length === 0) return;

        var grid = document.getElementById('relatedGrid');
        grid.innerHTML = filtered.map(function(b) {
            var imgHtml = b.sekil
                ? '<img class="related-card-img" src="' + b.sekil + '" alt="' + b.baslig + '" onerror="this.style.display=\'none\'">'
                : '<div class="related-card-placeholder">📰</div>';

            return '<a href="blog-post.html?id=' + b.id + '" class="related-card">' +
                imgHtml +
                '<div class="related-card-info">' +
                    '<div class="related-card-tag">' + (b.kateqoriya || 'Blog') + '</div>' +
                    '<h4>' + b.baslig + '</h4>' +
                    '<p>⏱️ ' + (b.oxuma_muddeti || '3 dəq') + '</p>' +
                '</div>' +
            '</a>';
        }).join('');

        document.getElementById('relatedSection').style.display = 'block';
    } catch(e) {}
}

loadPost();
</script>

</body>
</html>
