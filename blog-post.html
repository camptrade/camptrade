<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampTrade - Blog</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/shared.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fafaf8; }

        /* HERO */
        .post-hero-section {
            position: relative;
            height: 90vh;
            min-height: 500px;
            max-height: 700px;
            overflow: hidden;
        }

        .post-hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            display: block;
            transition: transform 8s ease;
        }

        .post-hero-img:hover { transform: scale(1.03); }

        .post-hero-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2d5a1b, #1a3a0a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
        }

        .post-hero-overlay {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
        }

        .post-hero-content {
            position: absolute;
            bottom: 40px;
            left: 0; right: 0;
            padding: 0 60px;
            max-width: 900px;
            margin: 0 auto;
        }

        .post-tag {
            display: inline-block;
            background: #f5a623;
            color: white;
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .post-hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            color: white;
            line-height: 1.25;
            font-weight: 800;
            text-shadow: 0 2px 20px rgba(0,0,0,0.4);
            margin-bottom: 16px;
        }

        .post-hero-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            flex-wrap: wrap;
        }

        /* BACK BUTTON */
        .back-btn {
            position: absolute;
            top: 25px;
            left: 30px;
            z-index: 10;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.3s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .back-btn:hover { background: rgba(255,255,255,0.3); }

        /* ARTICLE */
        .article-wrapper {
    max-width: 780px;
    margin: 0 auto;
    padding: 60px 30px 80px;
    background: white;
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
    border-radius: 0 0 20px 20px;
        }

        .article-intro {
            font-size: 20px;
            color: #333;
            line-height: 1.8;
            font-weight: 500;
            border-left: 4px solid #f5a623;
            padding-left: 20px;
            margin-bottom: 40px;
        }

        .article-body {
    font-size: 16px;
    color: #3a3a3a;
    line-height: 1.85;
}

.article-body h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: #2d5a1b;
    margin: 40px 0 15px;
    font-weight: 700;
    position: relative;
    padding-bottom: 10px;
}

.article-body h3 {
    font-size: 18px;
    color: #2d5a1b;
    margin: 30px 0 12px;
    font-weight: 600;
}

.article-body p {
    margin-bottom: 18px;
}

.article-body img {
    max-width: 100%;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    margin: 10px 0;
}

        .article-body h2 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: #2d5a1b;
            margin: 45px 0 18px;
            font-weight: 700;
            position: relative;
            padding-bottom: 12px;
        }

        .article-body h2::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 50px; height: 3px;
            background: #f5a623;
            border-radius: 2px;
        }

        .article-body p { margin-bottom: 20px; }

        .article-body ul, .article-body ol {
            margin: 10px 0 20px 25px;
        }

        .article-body ul li, .article-body ol li {
            margin-bottom: 10px;
            padding-left: 5px;
        }

        .article-body strong { color: #1a1a1a; font-weight: 700; }
        .article-body em { color: #555; font-style: italic; }

        .article-body div[style*="background:#e8f5e9"] {
            border-radius: 12px !important;
            border-left: 4px solid #2d5a1b !important;
            padding: 16px 20px !important;
            margin: 25px 0 !important;
            font-size: 15px !important;
        }

        /* DIVIDER */
        .article-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(to right, #2d5a1b, #f5a623);
            border-radius: 2px;
            margin: 40px 0;
        }

        /* SHARE */
        .share-section {
            background: #f9f9f9;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-top: 50px;
        }

        .share-section p {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .share-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        .share-btn {
            padding: 10px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.3s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .share-btn:hover { opacity: 0.85; transform: translateY(-2px); }
        .share-btn.wa { background: #25D366; color: white; }
        .share-btn.ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
        .share-btn.copy { background: #2d5a1b; color: white; }

        /* RELATED */
        .related-section {
            background: #f5f5f5;
            padding: 60px 30px;
        }

        .related-inner { max-width: 780px; margin: 0 auto; }

        .related-inner h3 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: #1a1a1a;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .related-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s, box-shadow 0.3s;
            display: block;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .related-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.12); }

        .related-card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .related-card-placeholder {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #2d5a1b, #1a3a0a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .related-card-info { padding: 18px; }
        .related-card-tag {
            font-size: 11px;
            font-weight: 700;
            color: #f5a623;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .related-card-info h4 { font-size: 15px; color: #1a1a1a; line-height: 1.5; font-weight: 600; margin-bottom: 8px; }
        .related-card-info p { font-size: 12px; color: #aaa; }

        /* LOADING */
        .loading-post {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 15px;
        }

        .loading-spinner-ring {
            width: 45px; height: 45px;
            border: 4px solid #eee;
            border-top-color: #2d5a1b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-post p { color: #888; font-size: 15px; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .post-hero-section { height: 65vh; min-height: 380px; }
            .post-hero-title { font-size: 26px; }
            .post-hero-content { padding: 0 25px; bottom: 30px; }
            .article-wrapper { padding: 40px 20px 60px; }
            .article-body { font-size: 16px; }
            .article-intro { font-size: 17px; }
            .back-btn { top: 15px; left: 15px; padding: 8px 15px; font-size: 12px; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">
        <img src="images/logo.jpeg" alt="CampTrade Logo">
    </a>
    <nav>
        <a href="index.html">Ana Səhifə</a>
        <a href="satis.html">Satılıq</a>
        <a href="kiraye.html">Kirayə</a>
        <a href="sat.html">Məhsul Sat</a>
        <a href="blog.html">Blog</a>
        <a href="elaqe.html">Əlaqə</a>
    </nav>
    <div class="lang-switcher">
        <button class="lang-btn active">🇦🇿</button>
        <button class="lang-btn">🇬🇧</button>
        <button class="lang-btn">🇷🇺</button>
    </div>
</header>

<div id="postContent">
    <div class="loading-post">
        <div class="loading-spinner-ring"></div>
        <p>Yazı yüklənir...</p>
    </div>
</div>

<div class="related-section" id="relatedSection" style="display:none">
    <div class="related-inner">
        <h3>Digər Yazılar</h3>
        <div class="related-grid" id="relatedGrid"></div>
    </div>
</div>

<footer>
    <div class="footer-logo">
        <img src="images/logo.jpeg" alt="CampTrade">
    </div>

        <a href="https://instagram.com/https://www.instagram.com/camp_trade?stkn=MTlxemZpaXY5Mm5qag==" target="_blank">📸 Instagram</a>
        <a href="https://wa.me/994554410372" target="_blank">💬 WhatsApp</a>
        <a href="https://tiktok.com/@LINKINI_YAZ" target="_blank">📱 TikTok</a>
    </div>
    <p>© 2026 CampTrade. All rights reserved.</p>
</footer>

<script>
var SUPABASE_URL = "https://iupwahtmnybxrowbkcfs.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cHdhaHRtbnlieHJvd2JrY2ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMTU3MDksImV4cCI6MjA5NTg5MTcwOX0.QG1fL54mB8-mMKhb3Amc7W7yhTAfo3mCP5UubdVqw4E";

function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

function copyLink() {
    navigator.clipboard.writeText(window.location.href);
    alert('✅ Link kopyalandı!');
}

async function loadPost() {
    var id = getParam('id');
    var container = document.getElementById('postContent');

    if (!id) {
        container.innerHTML = '<div style="text-align:center;padding:100px 20px;"><h2 style="color:#e53e3e;">❌ Yazı tapılmadı</h2><p style="color:#888;margin:15px 0;"><a href="blog.html" style="color:#2d5a1b;font-weight:700;">← Bloga qayıt</a></p></div>';
        return;
    }

    try {
        var res = await fetch(SUPABASE_URL + '/rest/v1/blogs?id=eq.' + id, {
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY
            }
        });

        var data = await res.json();

        if (!data || data.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:100px 20px;"><h2 style="color:#e53e3e;">❌ Yazı tapılmadı</h2><a href="blog.html" style="color:#2d5a1b;font-weight:700;">← Bloga qayıt</a></div>';
            return;
        }

        var b = data[0];
        var date = new Date(b.created_at).toLocaleDateString('az-AZ', {day:'numeric', month:'long', year:'numeric'});

        document.title = b.baslig + ' — CampTrade Blog';

        var waLink = 'https://wa.me/?text=' + encodeURIComponent(b.baslig + ' ' + window.location.href);
        var igLink = 'https://www.instagram.com/';

        var heroHtml = b.sekil
            ? '<img class="post-hero-img" src="' + b.sekil + '" alt="' + b.baslig + '">'
            : '<div class="post-hero-placeholder">📰</div>';

        container.innerHTML =
            '<div class="post-hero-section">' +
                '<a href="blog.html" class="back-btn">← Bloga Qayıt</a>' +
                heroHtml +
                '<div class="post-hero-overlay"></div>' +
                '<div class="post-hero-content">' +
                    '<span class="post-tag">' + b.kateqoriya + '</span>' +
                    '<h1 class="post-hero-title">' + b.baslig + '</h1>' +
                    '<div class="post-hero-meta">' +
                        '<span>📅 ' + date + '</span>' +
                        '<span>⏱️ ' + b.oxuma_muddeti + '</span>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="article-wrapper">' +
                '<div class="article-body">' + b.metn + '</div>' +
                '<div class="article-divider"></div>' +
                '<div class="share-section">' +
                    '<p>Bu yazını paylaş</p>' +
                    '<div class="share-btns">' +
                        '<a href="' + waLink + '" class="share-btn wa" target="_blank">💬 WhatsApp</a>' +
                        '<button onclick="copyLink()" class="share-btn copy" style="border:none;cursor:pointer;">🔗 Linki Kopyala</button>' +
                    '</div>' +
                '</div>' +
            '</div>';

        loadRelated(b.id, b.kateqoriya);

    } catch(e) {
        container.innerHTML = '<div style="text-align:center;padding:100px 20px;"><h2>❌ Xəta baş verdi</h2><a href="blog.html" style="color:#2d5a1b;">← Bloga qayıt</a></div>';
    }
}

async function loadRelated(currentId, category) {
    try {
        var res = await fetch(SUPABASE_URL + '/rest/v1/blogs?order=created_at.desc', {
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY
            }
        });

        var blogs = await res.json();
        var filtered = blogs.filter(function(b) { return b.id !== currentId; }).slice(0, 3);

        if (filtered.length === 0) return;

        var grid = document.getElementById('relatedGrid');
        grid.innerHTML = filtered.map(function(b) {
            var imgHtml = b.sekil
                ? '<img class="related-card-img" src="' + b.sekil + '" alt="' + b.baslig + '" onerror="this.style.display=\'none\'">'
                : '<div class="related-card-placeholder">📰</div>';

            return '<a href="blog-post.html?id=' + b.id + '" class="related-card">' +
                imgHtml +
                '<div class="related-card-info">' +
                    '<div class="related-card-tag">' + b.kateqoriya + '</div>' +
                    '<h4>' + b.baslig + '</h4>' +
                    '<p>⏱️ ' + b.oxuma_muddeti + '</p>' +
                '</div>' +
            '</a>';
        }).join('');

        document.getElementById('relatedSection').style.display = 'block';
    } catch(e) {}
}

loadPost();
</script>

</body>
