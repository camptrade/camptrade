<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>CampTrade - Satılıq Məhsullar</title>
<link rel="stylesheet" href="css/shared.css">
<style>
.page-hero{background:linear-gradient(135deg,#2d5a1b,#1a3a0a);color:#fff;padding:45px 20px;text-align:center}
.page-hero h1{font-size:34px;margin-bottom:8px}.page-hero p{opacity:.8}
.toolbar{max-width:1200px;margin:25px auto 0;padding:0 20px}
.search{width:100%;padding:14px 18px;border:2px solid #ddd;border-radius:12px;font-size:16px;outline:none;font-family:inherit}
.search:focus{border-color:#2d5a1b}
.chips{display:flex;gap:10px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border:2px solid #e0e0e0;color:#444;padding:9px 16px;border-radius:25px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:.2s}
.chip small{opacity:.6;margin-left:4px}
.chip:hover{border-color:#2d5a1b}
.chip.active{background:#2d5a1b;border-color:#2d5a1b;color:#fff}
.count{max-width:1200px;margin:10px auto 0;padding:0 20px;color:#888;font-size:14px}
.grid{max-width:1200px;margin:15px auto 50px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 3px 15px rgba(0,0,0,.08);transition:.3s;text-decoration:none;color:inherit;display:block}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 25px rgba(0,0,0,.15)}
.card .im{position:relative;height:210px;background:#eee}
.card img{width:100%;height:100%;object-fit:cover}
.card .tag{position:absolute;top:10px;left:10px;background:rgba(26,58,10,.85);color:#fff;font-size:12px;padding:4px 10px;border-radius:20px}
.card .in{padding:16px}
.card h3{font-size:16px;color:#222;margin-bottom:6px;line-height:1.4;min-height:44px}
.card .pr{font-size:22px;font-weight:700;color:#f5a623}
.card .cd{font-size:12px;color:#2d5a1b;font-weight:600;margin-top:4px}
.msg{grid-column:1/-1;text-align:center;padding:60px 20px;color:#888;font-size:17px}
@media(max-width:768px){.grid{grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}.card .im{height:150px}.card h3{font-size:14px;min-height:40px}.card .pr{font-size:18px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <a href="index.html" class="logo"><img src="images/logo.jpeg" alt="CampTrade Logo"></a>
  <nav>
    <a href="index.html">Ana Səhifə</a><a href="satis.html">Satılıq</a><a href="kiraye.html">Kirayə</a>
    <a href="sat.html">Məhsul Sat</a><a href="blog.html">Blog</a><a href="elaqe.html">Əlaqə</a>
  </nav>
  <div class="lang-switcher"><button class="lang-btn active">🇦🇿</button><button class="lang-btn">🇬🇧</button><button class="lang-btn">🇷🇺</button></div>
</header>

<div class="page-hero"><h1 id="pageTitle">🛒 Satılıq Məhsullar</h1><p>Outdoor avadanlıqları - yeni və ikinci əl</p></div>

<div class="toolbar">
  <input class="search" id="q" placeholder="🔍 Məhsul axtar...">
  <div class="chips" id="chips"></div>
</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"><div class="msg">⏳ Məhsullar yüklənir...</div></div>

<footer>
  <div class="footer-logo"><img src="images/logo.jpeg" alt="CampTrade"></div>
  <div class="social-links">
    <a href="https://www.instagram.com/camp_trade?igsh=MTlxemZpaXY5Mm5qag==" target="_blank">📸 Instagram</a>
    <a href="https://wa.me/994554410372" target="_blank">💬 WhatsApp</a>
  </div>
  <p>© 2026 CampTrade. All rights reserved.</p>
</footer>

<script>
var SUPABASE_URL="https://iupwahtmnybxrowbkcfs.supabase.co";
var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1cHdhaHRtbnlieHJvd2JrY2ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMTU3MDksImV4cCI6MjA5NTg5MTcwOX0.QG1fL54mB8-mMKhb3Amc7W7yhTAfo3mCP5UubdVqw4E";
var CAT='satis', TITLE='🛒 Satılıq Məhsullar';
var DEFAULT_SUB='Digər';
var all=[], active=new URLSearchParams(location.search).get('c')||'all';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sub(p){return p.alt_kateqoriya||DEFAULT_SUB}

document.getElementById('pageTitle').textContent=TITLE;

fetch(SUPABASE_URL+'/rest/v1/products?kateqoriya=eq.'+CAT+'&order=created_at.desc',
  {headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}})
.then(function(r){return r.json()})
.then(function(d){all=Array.isArray(d)?d:[];buildChips();render()})
.catch(function(){document.getElementById('grid').innerHTML='<div class="msg">❌ Yüklənmə xətası</div>'});

function buildChips(){
  var counts={};all.forEach(function(p){counts[sub(p)]=(counts[sub(p)]||0)+1});
  var h='<button class="chip" data-c="all">🌿 Hamısı<small>'+all.length+'</small></button>';
  Object.keys(counts).sort().forEach(function(k){
    h+='<button class="chip" data-c="'+esc(k)+'">'+esc(k)+'<small>'+counts[k]+'</small></button>';
  });
  var box=document.getElementById('chips');box.innerHTML=h;
  if(!counts[active])active='all';
  box.onclick=function(e){var b=e.target.closest('.chip');if(!b)return;active=b.getAttribute('data-c');render()};
}

function render(){
  document.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-c')===active)});
  var q=document.getElementById('q').value.toLowerCase().trim();
  var list=all.filter(function(p){
    return (active==='all'||sub(p)===active)&&(!q||(p.ad+' '+(p.melumat||'')).toLowerCase().indexOf(q)>-1);
  });
  document.getElementById('count').textContent=list.length+' məhsul tapıldı';
  var g=document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="msg">📭 Bu kateqoriyada məhsul yoxdur</div>';return}
  g.innerHTML=list.map(function(p){
    var img=(p.sekiller||'').split(',')[0].trim()||'images/logo.jpeg';
    return '<a class="card" href="product.html?id='+encodeURIComponent(p.id)+'">'+
      '<div class="im"><img src="'+esc(img)+'" alt="'+esc(p.ad)+'" loading="lazy" onerror="this.src=\'images/logo.jpeg\'"><span class="tag">'+esc(sub(p))+'</span></div>'+
      '<div class="in"><h3>'+esc(p.ad)+'</h3><div class="pr">'+esc(p.qiymet)+' AZN</div>'+
      '<div class="cd">'+esc(p.veziyyet||'')+'</div></div></a>';
  }).join('');
}
document.getElementById('q').addEventListener('input',render);
</script>
</body>
</html>
