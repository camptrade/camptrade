<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampTrade - Satılıq Məhsullar</title>
    <link rel="stylesheet" href="css/shared.css">
    <style>
        .page-hero {
            background: linear-gradient(135deg, #2d5a1b, #1a3a0a);
            color: white;
            padding: 50px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .page-hero svg { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0.07; pointer-events:none; }
        .page-hero-content { position: relative; z-index: 2; }
        .page-hero h1 { font-size: 36px; margin-bottom: 10px; }
        .page-hero p { opacity: 0.8; font-size: 16px; }

        .products-section { padding: 50px 40px; max-width: 1200px; margin: 0 auto; }

        .empty-state { text-align: center; padding: 80px 20px; color: #888; }
        .empty-state .icon { font-size: 80px; margin-bottom: 20px; }
        .empty-state h3 { font-size: 24px; color: #555; margin-bottom: 10px; }
        .empty-state p { font-size: 16px; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .product-card img { width: 100%; height: 220px; object-fit: cover; }
        .product-info { padding: 20px; }
        .product-info h3 { font-size: 18px; color: #2d5a1b; margin-bottom: 8px; }
        .product-price { font-size: 24px; font-weight: 700; color: #f5a623; margin-bottom: 8px; }
        .product-desc { font-size: 14px; color: #666; margin-bottom: 12px; line-height: 1.6; }
        .product-condition {
            display: inline-block;
            background: #e8f5e9;
            color: #2d5a1b;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .contact-btn {
            display: block;
            background: #25D366;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            margin-top: 12px;
            transition: opacity 0.3s;
            font-size: 15px;
        }
        .contact-btn:hover { opacity: 0.85; }
        .loading { text-align: center; padding: 60px; font-size: 18px; color: #888; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">
        <img src="images/logo.jpeg" alt="CampTrade Logo">
    </a>
    <nav>
        <a href="index.html">Ana Səhifə</a>
        <a href="satis.html">Satılıq</a>
        <a href="kiraye.html">Kirayə</a>
        <a href="sat.html">Məhsul Sat</a>
        <a href="blog.html">Blog</a>
        <a href="elaqe.html">Əlaqə</a>
    </nav>
    <div class="lang-switcher">
        <button class="lang-btn active">🇦🇿</button>
        <button class="lang-btn">🇬🇧</button>
        <button class="lang-btn">🇷🇺</button>
    </div>
</header>

<div class="page-hero">
    <svg viewBox="0 0 1440 300" preserveAspectRatio="xMidYMid slice">
        <polygon points="-50,300 150,100 300,200 500,30 700,160 900,20 1100,180 1300,70 1490,130 1490,300" fill="white"/>
    </svg>
    <div class="page-hero-content">
        <h1>🛒 Satılıq Məhsullar</h1>
        <p>Outdoor avadanlıqları - yeni və ikinci əl</p>
    </div>
</div>

<div class="products-section">
    <div class="loading" id="loading">⏳ Məhsullar yüklənir...</div>
    <div class="products-grid" id="productsGrid" style="display:none"></div>
    <div class="empty-state" id="emptyState" style="display:none">
        <div class="icon">🏕️</div>
        <h3>Tezliklə məhsullar əlavə olunacaq!</h3>
        <p>Hal-hazırda satılıq məhsul yoxdur.</p>
    </div>
</div>

<footer>
    <div class="footer-logo">
        <img src="images/logo.jpeg" alt="CampTrade">
    </div>
    <div class="social-links">
        <a href="https://facebook.com/LINKINI_YAZ" target="_blank">📘 Facebook</a>
        <a href="https://instagram.com/LINKINI_YAZ" target="_blank">📸 Instagram</a>
        <a href="https://wa.me/994NOMERINIYAZ" target="_blank">💬 WhatsApp</a>
        <a href="https://tiktok.com/@LINKINI_YAZ" target="_blank">📱 TikTok</a>
    </div>
    <p>© 2026 CampTrade. All rights reserved.</p>
</footer>

<script>
const data = JSON.parse(localStorage.getItem('products') || '{"satis":[],"kiraye":[]}');
const loading = document.getElementById('loading');
const grid = document.getElementById('productsGrid');
const empty = document.getElementById('emptyState');

loading.style.display = 'none';
const mehsullar = data.satis;

if (!mehsullar || mehsullar.length === 0) {
    empty.style.display = 'block';
} else {
    grid.style.display = 'grid';
    mehsullar.forEach(m => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${m.sekil}" alt="${m.ad}" onerror="this.src='images/logo.jpeg'">
                <div class="product-info">
                    <h3>${m.ad}</h3>
                    <div class="product-price">${m.qiymet} AZN</div>
                    <span class="product-condition">${m.veziyyet || 'Yeni'}</span>
                    <p class="product-desc">${m.melumat}</p>
                    <a href="https://wa.me/${m.whatsapp}" class="contact-btn" target="_blank">
                        💬 WhatsApp ilə Əlaqə
                    </a>
                </div>
            </div>
        `;
    });
}
</script>

</body>
</html>
